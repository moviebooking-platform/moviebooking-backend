name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

# Cancel an in-progress run when new commits arrive on the same branch or PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, type-check and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Services import the libraries through their compiled dist/, so build them first.
      - name: Build shared libraries
        run: npm run build:libs

      - name: Lint (no fixes)
        run: npm run lint:check

      - name: Type-check every package
        run: npm run typecheck

      - name: Unit tests with coverage (every package)
        run: npm run test:cov

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            services/*/coverage/
            libs/*/coverage/
          if-no-files-found: ignore
          retention-days: 14
